[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiiforge"
version = "0.1.0"
description = "Wii homebrew evidence, resumable planning and controlled file preparation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
readme = "README.md"
keywords = ["wii", "homebrew", "usb-loader-gx", "read-only", "planning"]

[project.urls]
Repository = "https://github.com/jcb79107/wiiforge"
Issues = "https://github.com/jcb79107/wiiforge/issues"
Documentation = "https://github.com/jcb79107/wiiforge/blob/main/docs/usage.md"

[project.scripts]
wiiforge = "wiiforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
