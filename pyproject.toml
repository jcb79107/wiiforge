[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiiforge"
version = "0.1.0"
description = "Read-only Wii homebrew evidence and resumable manual planning"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
wiiforge = "wiiforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
