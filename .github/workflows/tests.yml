name: Synthetic tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic tests and smoke test (no project dependencies)
        env:
          PYTHONPATH: src
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
          python3 -m wiiready start
          python3 -m wiiready demo
          python3 -m wiiready rehearse
          python3 -m compileall -q src
  windows-readonly:
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Windows intake and session tests
        run: python -m unittest discover -s tests -p test_onboarding.py -v
      - name: Command compatibility and optional picture flow
        run: python -m unittest discover -s tests -p test_identity.py -v
      - name: Windows private ZIP checks
        run: python -m unittest discover -s tests -p test_exploit.py -v
      - name: Windows game header checks
        run: python -m unittest discover -s tests -p test_games.py -v
      - name: Windows game-copy host restriction
        run: python -m unittest discover -s tests -p test_gamecopy.py -v
      - name: Windows join host restriction
        run: python -m unittest discover -s tests -p test_wiijoin.py -v
      - name: Windows private plan summaries
        run: python -m unittest discover -s tests -p test_plan_summary.py -v
      - name: Intake smoke test
        run: python -m wiiready start
      - name: Synthetic plan smoke test
        run: python -m wiiready demo
